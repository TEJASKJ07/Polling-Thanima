<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Admin Control Desk - PulsePoll</title>
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/xXM8L8cR/images.jpg">
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Space+Grotesk:wght@600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
</head>

<body class="min-h-screen flex flex-col font-sans selection:bg-yellow-400 selection:text-purple-900"
    style="background: radial-gradient(circle at 50% 0%, #451b72 0%, #20073b 50%, #110321 100%); background-attachment: fixed; color: rgb(254, 247, 255);">

    <!-- Header -->
    <header class="w-full h-20 backdrop-blur-xl border-b border-amber-200/15 px-6 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <img src="https://i.postimg.cc/Xrdq9qpL/images-removebg-preview.png" alt="Logo"
                class="h-10 w-auto object-contain">
            <div class="flex flex-col">
                <span class="text-xs uppercase font-bold text-amber-200">Aksharamuttam</span>
                <span class="font-bold text-xl">Admin Control Desk</span>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 flex justify-center items-center p-4 py-8">

        <!-- Login Card -->
        <div id="loginCard"
            class="w-full max-w-md p-8 rounded-2xl flex flex-col gap-5 shadow-2xl backdrop-blur-xl border border-amber-200/25"
            style="background: rgba(69, 27, 114, 0.8);">
            <div class="flex flex-col gap-1 text-center">
                <h1 class="text-2xl font-bold">Admin Login</h1>
                <p class="text-xs text-purple-200/70">Enter password to manage polls</p>
            </div>

            <form onsubmit="handleLogin(event)" class="flex flex-col gap-4">
                <input type="password" id="passwordInput" placeholder="Password (default: admin123)" required
                    class="w-full px-4 py-3 rounded-xl bg-purple-950/60 border border-amber-200/30 text-white placeholder-purple-300/40 focus:outline-none focus:border-amber-300">
                <button type="submit"
                    class="w-full py-3 rounded-xl font-bold shadow-md transition-all hover:scale-[1.01]"
                    style="background: linear-gradient(135deg, #fddf9e 0%, #f3c267 100%); color: rgb(49, 14, 87);">
                    Authenticate
                </button>
            </form>
            <p id="errorMsg" class="text-red-400 text-xs text-center hidden"></p>
        </div>

        <!-- Full Admin Management Panel -->
        <div id="adminPanel"
            class="hidden w-full max-w-2xl p-6 sm:p-8 rounded-2xl flex-col gap-6 shadow-2xl backdrop-blur-xl border border-amber-200/25"
            style="background: rgba(69, 27, 114, 0.85);">
            <div class="flex items-center justify-between pb-4 border-b border-amber-200/15">
                <div>
                    <h2 class="text-xl font-bold">Poll Setup & Management</h2>
                    <p class="text-xs text-purple-200/70">Configure questions, options, and voting rules live</p>
                </div>
                <span
                    class="text-xs px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">Live
                    Mode</span>
            </div>

            <!-- Form Controls -->
            <div class="flex flex-col gap-5">

                <!-- Question Input -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold uppercase tracking-wider text-amber-200">Poll Question /
                        Title</label>
                    <input type="text" id="pollTitleInput"
                        placeholder="e.g., Select your preferred team representatives"
                        class="w-full px-4 py-3 rounded-xl bg-purple-950/60 border border-amber-200/30 text-white focus:outline-none focus:border-amber-300">
                </div>

                <!-- Allowed Choices per voter -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs font-bold uppercase tracking-wider text-amber-200">Max Choices per
                        Voter</label>
                    <input type="number" id="maxVotesInput" min="1" max="10" value="1"
                        class="w-full sm:w-48 px-4 py-2.5 rounded-xl bg-purple-950/60 border border-amber-200/30 text-white focus:outline-none focus:border-amber-300">
                    <span class="text-[11px] text-purple-200/60">Set how many candidates a single voter can pick on
                        their ballot.</span>
                </div>

                <!-- Candidates Dynamic Inputs -->
                <div class="flex flex-col gap-2.5">
                    <label class="text-xs font-bold uppercase tracking-wider text-amber-200">Candidates / Options
                        List</label>
                    <div id="candidateList" class="flex flex-col gap-2.5"></div>

                    <button type="button" onclick="addCandidateInput()"
                        class="mt-1 self-start px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 bg-purple-800/50 hover:bg-purple-800 border border-amber-200/30 text-amber-200 transition-all">
                        <span class="material-symbols-outlined text-[16px]">add</span>
                        <span>Add Candidate Option</span>
                    </button>
                </div>

                <!-- Action CTA Buttons -->
                <div class="flex flex-col sm:flex-row gap-3 pt-4 border-t border-amber-200/15">
                    <button onclick="saveAndPublishPoll()"
                        class="flex-1 py-3.5 px-6 rounded-xl font-bold flex items-center justify-center gap-2 shadow-lg transition-all hover:scale-[1.01]"
                        style="background: linear-gradient(135deg, #fddf9e 0%, #f3c267 100%); color: rgb(49, 14, 87);">
                        <span class="material-symbols-outlined text-[20px]">publish</span>
                        <span>Publish New Poll & Reset Tally</span>
                    </button>
                    <button onclick="resetVotes()"
                        class="py-3.5 px-5 rounded-xl font-bold bg-red-600/80 hover:bg-red-600 text-white transition-all">
                        Reset Votes Only
                    </button>
                </div>

                <div class="pt-2 text-center">
                    <a href="results.html" target="_blank"
                        class="text-xs text-amber-200/80 hover:underline inline-flex items-center gap-1">
                        Open Broadcast Stream Window ↗
                    </a>
                </div>
            </div>
        </div>

    </main>

    <script>
        const RAILWAY_URL = "https://polling-thanima-1.onrender.com/";
        const BACKEND_URL = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") && window.location.port === "3000"
            ? "http://localhost:3000"
            : RAILWAY_URL;

        const socket = io(BACKEND_URL, {
            transports: ['websocket', 'polling']
        });

        function handleLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('passwordInput').value;
            socket.emit('adminLogin', pass);
        }

        socket.on('adminAuthSuccess', () => {
            document.getElementById('loginCard').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            document.getElementById('adminPanel').classList.add('flex');
        });

        socket.on('adminAuthError', (msg) => {
            const err = document.getElementById('errorMsg');
            err.innerText = msg;
            err.classList.remove('hidden');
        });

        // Pre-fill controls with live data when connected
        socket.on('pollUpdated', (poll) => {
            if (document.getElementById('adminPanel').classList.contains('hidden')) {
                document.getElementById('pollTitleInput').value = poll.title;
                document.getElementById('maxVotesInput').value = poll.maxVotesPerUser;

                const list = document.getElementById('candidateList');
                list.innerHTML = '';
                poll.candidates.forEach(c => addCandidateInput(c.name));
            }
        });

        // Add Input Row for Candidate Name
        function addCandidateInput(value = '') {
            const container = document.getElementById('candidateList');
            const div = document.createElement('div');
            div.className = 'candidate-row flex items-center gap-2';

            div.innerHTML = `
                <input type="text" value="${value}" placeholder="Enter candidate name..." class="candidate-input flex-1 px-4 py-2.5 rounded-xl bg-purple-950/60 border border-amber-200/30 text-white focus:outline-none focus:border-amber-300 text-sm">
                <button type="button" onclick="removeCandidateInput(this)" class="p-2.5 rounded-xl bg-red-500/20 hover:bg-red-500/40 text-red-300 border border-red-500/30 flex items-center justify-center">
                    <span class="material-symbols-outlined text-[18px]">delete</span>
                </button>
            `;
            container.appendChild(div);
        }

        function removeCandidateInput(btn) {
            const rows = document.querySelectorAll('.candidate-row');
            if (rows.length <= 2) {
                alert('A poll must have at least 2 candidates.');
                return;
            }
            btn.closest('.candidate-row').remove();
        }

        // Send updated config to server
        function saveAndPublishPoll() {
            const title = document.getElementById('pollTitleInput').value;
            const maxVotesPerUser = document.getElementById('maxVotesInput').value;

            const inputs = document.querySelectorAll('.candidate-input');
            const candidates = Array.from(inputs).map(i => i.value).filter(val => val.trim() !== "");

            if (candidates.length < 2) {
                alert("Please provide at least 2 valid candidate names.");
                return;
            }

            if (confirm("Publishing this new poll will reset all current live votes. Proceed?")) {
                socket.emit('updatePollConfig', {
                    title,
                    maxVotesPerUser,
                    candidates
                });
                alert("Poll published live!");
            }
        }

        function resetVotes() {
            if (confirm("Are you sure you want to reset all current candidate votes to 0?")) {
                socket.emit('resetVotes');
            }
        }
    </script>
</body>

</html>
